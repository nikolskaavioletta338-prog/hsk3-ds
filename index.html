<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>HSK 3 · Тренажёр</title>
    <style>
        /* ---------- CSS Variables: Light / Dark Theme ---------- */
        :root {
            --bg: #f7f5f0;
            --surface: #ffffff;
            --surface-alt: #f0ede8;
            --text: #2c2c2c;
            --text-muted: #6b6b6b;
            --primary: #b33e2c;
            --primary-soft: #f7e6e3;
            --accent: #c99a3b;
            --accent-soft: #fdf3e0;
            --border: #ddd8d0;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --radius-sm: 8px;
            --font-scale: 1;
            --transition: 0.2s ease;
            --card-bg: #ffffff;
            --card-back: #fcf8f2;
            --success: #3e7c4b;
            --error: #c0392b;
            --warning: #e67e22;
            --font-chinese: "KaiTi", "STKaiti", "Kai", "Noto Serif SC", "SimSun", serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        [data-theme="dark"] {
            --bg: #1a1a1e;
            --surface: #25252b;
            --surface-alt: #2d2d35;
            --text: #e8e6e3;
            --text-muted: #9a9a9a;
            --primary: #e06b5a;
            --primary-soft: #3a2522;
            --accent: #e0b35c;
            --accent-soft: #3a3220;
            --border: #3d3d45;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            --card-bg: #2d2d35;
            --card-back: #36363e;
            --success: #4caf7c;
            --error: #e74c3c;
        }
        /* Large / Compact */
        [data-size="large"] { --font-scale: 1.25; }
        [data-size="compact"] { --font-scale: 0.9; }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: calc(16px * var(--font-scale)); scroll-behavior: smooth; }
        body {
            font-family: var(--font-ui);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0.8rem;
            transition: background var(--transition), color var(--transition);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .app {
            max-width: 1100px;
            margin: 0 auto;
        }
        /* ---------- Typography ---------- */
        h1, h2, h3, h4 { font-weight: 600; line-height: 1.3; }
        h1 { font-size: 1.6rem; }
        h2 { font-size: 1.3rem; }
        h3 { font-size: 1.1rem; }
        p { line-height: 1.6; }
        .chinese {
            font-family: var(--font-chinese);
            line-height: 1.8;
            letter-spacing: 0.02em;
        }
        .pinyin {
            color: var(--text-muted);
            font-size: 0.9em;
            font-style: italic;
        }
        .translation {
            color: var(--text-muted);
            font-size: 0.95em;
        }
        /* ---------- Buttons & Inputs ---------- */
        button {
            font-family: inherit;
            font-size: 0.95rem;
            padding: 0.7em 1.2em;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            transition: all var(--transition);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        button:hover, button:focus-visible {
            background: var(--surface-alt);
            border-color: var(--primary);
            outline: none;
        }
        button:active { transform: scale(0.97); }
        button.primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        button.primary:hover { opacity: 0.9; }
        button.accent {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        button.accent:hover { opacity: 0.9; }
        button.small { padding: 0.4em 0.8em; font-size: 0.85rem; }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        input[type="text"], textarea, select {
            font-family: inherit;
            font-size: 0.95rem;
            padding: 0.6em 0.8em;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text);
            width: 100%;
            transition: border var(--transition);
        }
        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            outline: none;
        }
        /* ---------- Layout ---------- */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            padding: 0.6rem 0;
            margin-bottom: 0.8rem;
        }
        .header-left { display: flex; align-items: center; gap: 0.6rem; }
        .header-right { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
        .logo {
            font-family: var(--font-chinese);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            cursor: pointer;
            white-space: nowrap;
        }
        .logo span { font-family: var(--font-ui); font-size: 0.75rem; color: var(--text-muted); display: block; line-height: 1; }
        .theme-toggle, .size-toggle {
            background: var(--surface-alt);
            border: none;
            padding: 0.4em 0.6em;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            cursor: pointer;
        }
        .main-menu {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.7rem;
            margin-bottom: 1.2rem;
        }
        .menu-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem 0.8rem;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            font-weight: 500;
        }
        .menu-card:hover, .menu-card:focus-visible {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }
        .menu-card .icon { font-size: 1.6rem; line-height: 1; }
        .menu-card .label { font-size: 0.9rem; }
        .menu-card .sub { font-size: 0.75rem; color: var(--text-muted); }
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow);
        }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
        }
        .panel-header h2 { margin: 0; }
        .hidden { display: none !important; }
        /* ---------- Flashcard ---------- */
        .flashcard-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 0.5rem 0;
        }
        .flashcard {
            width: 100%;
            max-width: 500px;
            min-height: 240px;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color var(--transition);
            box-shadow: var(--shadow);
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }
        .flashcard.flipped {
            transform: rotateY(180deg);
            background: var(--card-back);
        }
        .flashcard-inner {
            backface-visibility: hidden;
            transition: transform 0.4s ease;
            width: 100%;
        }
        .flashcard-front, .flashcard-back {
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
        }
        .flashcard-front .chinese { font-size: 2.2rem; }
        .flashcard-back .chinese { font-size: 1.6rem; }
        .flashcard-back .pinyin { font-size: 1.1rem; }
        .flashcard-back .translation { font-size: 1.1rem; }
        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
        }
        /* ---------- Exercise / Quiz ---------- */
        .exercise-container {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .question-text {
            font-size: 1.1rem;
            font-weight: 500;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .option-btn {
            text-align: left;
            padding: 0.8em 1em;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            transition: all var(--transition);
            width: 100%;
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        .option-btn.correct {
            background: var(--success);
            color: #fff;
            border-color: var(--success);
        }
        .option-btn.incorrect {
            background: var(--error);
            color: #fff;
            border-color: var(--error);
        }
        .feedback {
            font-weight: 500;
            padding: 0.5rem 0;
            min-height: 1.5em;
        }
        .feedback.correct { color: var(--success); }
        .feedback.incorrect { color: var(--error); }
        /* ---------- Stats / Progress ---------- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.7rem;
        }
        .stat-item {
            background: var(--surface-alt);
            border-radius: var(--radius-sm);
            padding: 0.8rem;
            text-align: center;
        }
        .stat-item .value { font-size: 1.4rem; font-weight: 700; color: var(--primary); }
        .stat-item .label { font-size: 0.8rem; color: var(--text-muted); }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: var(--surface-alt);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar > div {
            height: 100%;
            background: var(--primary);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        /* ---------- Lists & Tables ---------- */
        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 0.4rem;
            border-bottom: 1px solid var(--border);
            gap: 0.5rem;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item .chinese { font-size: 1.1rem; }
        .list-item .pinyin { font-size: 0.85rem; }
        .list-item .translation { font-size: 0.9rem; }
        .ticket-card {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 1rem;
            margin-bottom: 0.7rem;
            cursor: pointer;
            transition: border var(--transition);
        }
        .ticket-card:hover { border-color: var(--primary); }
        .ticket-card .ticket-title {
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ticket-card .ticket-body {
            margin-top: 0.6rem;
            font-size: 0.95rem;
        }
        .tag {
            display: inline-block;
            padding: 0.15em 0.6em;
            border-radius: 20px;
            font-size: 0.75rem;
            background: var(--surface-alt);
            color: var(--text-muted);
            border: 1px solid var(--border);
            margin-right: 0.3rem;
            margin-bottom: 0.2rem;
        }
        .tag.primary { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
        .tag.accent { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
        /* ---------- Modal ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1.2rem;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 0.6rem;
            right: 0.6rem;
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0.2em 0.4em;
            line-height: 1;
        }
        .modal-close:hover { color: var(--text); }
        /* ---------- Misc ---------- */
        .flex { display: flex; }
        .flex-wrap { flex-wrap: wrap; }
        .gap-1 { gap: 0.4rem; }
        .gap-2 { gap: 0.8rem; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .mt-1 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mb-1 { margin-bottom: 0.5rem; }
        .mb-2 { margin-bottom: 1rem; }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-muted); }
        .w-full { width: 100%; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
        @media (max-width: 500px) {
            .grid-2 { grid-template-columns: 1fr; }
            .main-menu { grid-template-columns: repeat(2, 1fr); }
        }
        /* ---------- Scrollbar ---------- */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--surface-alt); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* Chinese text in UI */
        .chinese-text { font-family: var(--font-chinese); }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            color: var(--text);
            padding: 0.7em 1.4em;
            border-radius: 30px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            font-size: 0.9rem;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            max-width: 90vw;
            text-align: center;
        }
        .toast.show { opacity: 1; }
    </style>
</head>

    { id:39, lesson:16, title:'Удвоение односложных прилагательных', formula:'AA + 的', explanation:'Указывает на высокую степень признака', examples:['你送的花红红的，我很喜欢。','这些草绿绿的，真漂亮。','他鼻子小小的，长得像谁？'] },
    { id:40, lesson:17, title:'Удвоение двусложных глаголов', formula:'ABAB', explanation:'Указывает на кратковременность или попытку', examples:['他是谁？你介绍我们认识认识吧。','有时间你帮助帮助他吧。','我真应该多锻炼锻炼了。'] },
    { id:41, lesson:17, title:'Вопросительные местоимения (3)', formula:'谁/什么/怎么/哪儿 + 都/也', explanation:'Обобщение: все, всё, везде', examples:['谁都喜欢小丽。','小刚什么都喜欢吃。','最近我觉得哪儿都不舒服。'] },
    { id:42, lesson:18, title:'只要……就……', formula:'只要 + ..., 就 + ...', explanation:'Достаточное условие', examples:['只要我有时间，就一定跟你去旅游。','我只要喜欢，就一定会买。','只要你给我买，我就能照顾好它。'] },
    { id:43, lesson:18, title:'Предлог 关于', formula:'关于 + сущ.', explanation:'Вводит объект речи', examples:['我最近看了一些关于中国文化的电影。','关于这件事，我们还没有决定呢。','关于这个工作，还有什么问题吗？'] },
    { id:44, lesson:19, title:'Переносное значение направительных комплементов', formula:'V + 出来 / 下来 / 起来', explanation:'出来 — появление нового, распознавание; 下来 — переход от движения к покою; 起来 — результат воспоминания', examples:['这个字你能写出来吗？','天黑了，孩子们要回家了。','我想起来了。'] },
    { id:45, lesson:19, title:'使, 叫, 让', formula:'使/叫/让 + сущ. + V', explanation:'Каузативная конструкция', examples:['读书使我快乐。','考试让我很紧张。','穿运动服让他更年轻。'] },
    { id:46, lesson:20, title:'Пассивная конструкция с 被', formula:'S + 被/叫/让 + O + V + ...', explanation:'Пассивный залог', examples:['我被男朋友影响了。','帽子被刮跑了。','我的照相机被谁拿走了？'] },
    { id:47, lesson:20, title:'只有……才……', formula:'只有 + ..., 才 + ...', explanation:'Единственное условие', examples:['只有写完作业，才能看电视。','只有妈妈做的饭，她才爱吃。','只有爸爸、妈妈才能分出来。'] },
];

const TEXTS = [
    { id:1, lesson:1, title:'周末你有什么打算', titleRu:'Что ты планируешь на выходные?', content:'小丽：周末你有什么打算？\n小刚：我早就想好了，请你吃饭、看电影、喝咖啡。\n小丽：请我？\n小刚：是啊，我已经找好饭馆了，电影票也买好了。\n小丽：我还没想好要不要跟你去呢。', translation:'Сяоли: Что ты планируешь на выходные?\nСяоган: Я уже давно придумал: приглашу тебя поужинать, посмотреть фильм, выпить кофе.\nСяоли: Меня?\nСяоган: Да, я уже нашёл ресторан, и билеты в кино купил.\nСяоли: Я ещё не решила, идти ли с тобой.' },
    { id:2, lesson:2, title:'他什么时候回来', titleRu:'Когда он вернётся?', content:'周太太：喂，你好，请问周明在吗？\n秘书：周经理出去了，不在办公室。\n周太太：他去哪儿了？什么时候回来？\n秘书：他出去办事了，下午回来。\n周太太：回来了就让他给我打个电话。\n秘书：好的，他到了办公室我就告诉他。', translation:'Госпожа Чжоу: Алло, здравствуйте, Чжоу Мин на месте?\nСекретарь: Менеджер Чжоу вышел, его нет в офисе.\nГоспожа Чжоу: Куда он пошёл? Когда вернётся?\nСекретарь: Он ушёл по делам, вернётся после обеда.\nГоспожа Чжоу: Как вернётся, пусть позвонит мне.\nСекретарь: Хорошо, как только он придёт в офис, я ему скажу.' },
    { id:3, lesson:3, title:'桌子上放着很多饮料', titleRu:'На столе стоит много напитков', content:'小丽：桌子上放着很多饮料，你喝什么？\n小刚：茶或者咖啡都可以。你呢？你喝什么？\n小丽：我喝茶，茶是我的最爱。天冷了或者工作累了的时候，喝杯热茶会很舒服。\n小刚：你喜欢喝什么茶？\n小丽：花茶、绿茶、红茶，我都喜欢。', translation:'Сяоли: На столе стоит много напитков, что ты будешь?\nСяоган: Чай или кофе — всё можно. А ты? Что ты будешь?\nСяоли: Я буду чай, чай — моя любовь. Когда холодно или устал от работы, выпить чашку горячего чая очень приятно.\nСяоган: Какой чай ты любишь?\nСяоли: Цветочный, зелёный, чёрный — все люблю.' },
    { id:4, lesson:4, title:'她总是笑着跟客人说话', titleRu:'Она всегда улыбается, разговаривая с гостями', content:'小丽：你觉得小红怎么样？\n同学：她又聪明又热情，也很努力。\n小丽：我看她总是笑着回答老师的问题。\n同学：她对每个人都笑，也常常对我笑。\n小丽：你是不是喜欢她啊？\n同学：喜欢她的人太多了，你看那些拿着鲜花站在门口的，都是等她的。', translation:'Сяоли: Как ты думаешь о Сяохун?\nОднокурсник: Она и умная, и热情, и очень усердная.\nСяоли: Я вижу, она всегда с улыбкой отвечает на вопросы учителя.\nОднокурсник: Она всем улыбается, и мне тоже часто.\nСяоли: Ты что, влюбился в неё?\nОднокурсник: У неё слишком много поклонников, видишь тех, с цветами у входа, все ждут её.' },
    { id:5, lesson:5, title:'我最近越来越胖了', titleRu:'Я в последнее время становлюсь всё толще', content:'小丽：我最近越来越胖了。\n小刚：谁说的？我觉得你越来越漂亮了。\n小丽：你看，这条裙子是去年买的，今年就不能穿了。\n小刚：那是因为你吃得太多了，少吃点儿吧。\n小丽：我做的饭越来越好吃，我能少吃吗？', translation:'Сяоли: Я в последнее время становлюсь всё толще.\nСяоган: Кто сказал? Я думаю, ты становишься всё красивее.\nСяоли: Смотри, эту юбку я купила в прошлом году, а в этом уже не могу носить.\nСяоган: Это потому, что ты слишком много ешь, ешь поменьше.\nСяоли: Еда, которую я готовлю, становится всё вкуснее, как я могу есть меньше?' },
    { id:6, lesson:6, title:'怎么突然找不到了', titleRu:'Как вдруг пропало?', content:'周明：我的眼镜呢？怎么突然找不到了？你看见了吗？\n周太太：我没看见啊。\n周明：我离不开眼镜，没有眼镜，我一个字也看不清楚。\n周太太：你去房间找找，是不是刚才放在桌子上了？\n周明：我怎么看得到啊？你快过来帮忙啊。\n周太太：好吧，我帮你去找找。', translation:'Чжоу Мин: Где мои очки? Как вдруг пропали? Ты видела?\nГоспожа Чжоу: Я не видела.\nЧжоу Мин: Я не могу без очков, без них я ни одного слова не вижу.\nГоспожа Чжоу: Пойди в комнату поищи, может, только что на стол положил?\nЧжоу Мин: Как я найду? Иди скорее помоги.\nГоспожа Чжоу: Ладно, помогу тебе поискать.' },
    { id:7, lesson:7, title:'我跟她都认识五年了', titleRu:'Я с ней знаком уже пять лет', content:'小刚：我跟小丽下个月结婚，到时候欢迎你来。\n同事：什么？结婚？\n小刚：对啊，突然吗？\n同事：你们不是刚认识吗？\n小刚：我跟她都认识五年了。\n同事：你跟她结婚，那我怎么办啊？', translation:'Сяоган: Мы с Сяоли в следующем месяце женимся, добро пожаловать.\nКоллега: Что? Свадьба?\nСяоган: Да, внезапно?\nКоллега: Вы же только что познакомились?\nСяоган: Я с ней знаком уже пять лет.\nКоллега: Ты на ней женишься, а как же я?' },
    { id:8, lesson:8, title:'你去哪儿我就去哪儿', titleRu:'Куда ты, туда и я', content:'小丽：小刚，我们坐哪儿？\n小刚：你坐哪儿我就坐哪儿。\n小丽：坐这儿吧，这儿安静。你想喝什么饮料？\n小刚：你喝什么我就喝什么。\n小丽：喝可乐吧。你等我一会儿，我马上回来。\n小刚：小丽，你去哪儿？你去哪儿我就去哪儿。\n小丽：我去洗手间。', translation:'Сяоли: Сяоган, куда сядем?\nСяоган: Куда ты, туда и я.\nСяоли: Давай сюда, здесь тихо. Что будешь пить?\nСяоган: Что ты, то и я.\nСяоли: Давай колу. Подожди меня немного, я скоро вернусь.\nСяоган: Сяоли, ты куда? Куда ты, туда и я.\nСяоли: Я в туалет.' },
    { id:9, lesson:9, title:'她的汉语说得跟中国人一样好', titleRu:'Она говорит по-китайски так же хорошо, как китаец', content:'大山：马可，你的中文越说越好了！\n马可：哪里哪里，我们班李静说得更好。\n大山：怎么好？\n马可：她的汉语说得跟中国人一样好。\n大山：李静？我怎么没听说过这个名字？\n马可：她是我们的汉语老师。', translation:'Дашань: Марк, твой китайский становится всё лучше!\nМарк: Что ты, в нашей группе Ли Цзин говорит ещё лучше.\nДашань: Насколько лучше?\nМарк: Она говорит по-китайски так же хорошо, как китаец.\nДашань: Ли Цзин? Я что-то не слышал этого имени.\nМарк: Она наш учитель китайского.' },
    { id:10, lesson:10, title:'数学比历史难多了', titleRu:'Математика намного сложнее истории', content:'小明：我喜欢历史课、体育课，不喜欢数学课。\n同学：为什么？数学也很有意思啊。\n小明：我觉得数学比历史难多了，我听不懂。\n同学：别担心，我可以帮你。\n小明：好啊，我们每天学多长时间？\n同学：一两个小时吧。', translation:'Сяомин: Я люблю уроки истории, физкультуры, не люблю математику.\nОднокурсник: Почему? Математика тоже очень интересная.\nСяомин: Я думаю, математика намного сложнее истории, я не понимаю.\nОднокурсник: Не волнуйся, я могу помочь.\nСяомин: Хорошо, сколько будем заниматься каждый день?\nОднокурсник: Часа-два.' },
    { id:11, lesson:11, title:'别忘了把空调关了', titleRu:'Не забудь выключить кондиционер', content:'小明：我先走了。\n同学：你去哪儿？\n小明：我去图书馆借本书。\n同学：帮我把这本词典还了吧。\n小明：好，等一会儿你离开教室的时候，记得把灯关了。\n同学：好的，放心吧。', translation:'Сяомин: Я пошёл.\nОднокурсник: Ты куда?\nСяомин: В библиотеку, взять книгу.\nОднокурсник: Помоги мне вернуть этот словарь.\nСяомин: Хорошо, когда будешь уходить из класса, не забудь выключить свет.\nОднокурсник: Хорошо, не волнуйся.' },
    { id:12, lesson:12, title:'把重要的东西放在我这儿吧', titleRu:'Оставь важные вещи у меня', content:'周明：你怎么才来？\n小刚：对不起，周经理，来机场的路上我才发现忘带护照了。\n周明：快点吧，飞机就要起飞了。\n小刚：您有钱吗？司机把我送到机场的时候，我才发现忘记带钱包了。\n周明：我看你还是把重要的东西放在我这儿吧。', translation:'Чжоу Мин: Почему ты только сейчас?\nСяоган: Извините, менеджер Чжоу, по дороге в аэропорт я обнаружил, что забыл паспорт.\nЧжоу Мин: Быстрее, самолёт скоро взлетает.\nСяоган: У вас есть деньги? Когда водитель привёз меня в аэропорт, я обнаружил, что забыл кошелёк.\nЧжоу Мин: Я думаю, тебе лучше оставить важные вещи у меня.' },
    { id:13, lesson:13, title:'我是走回来的', titleRu:'Я вернулся пешком', content:'小丽：你终于回来了！从哪儿买回来这么多东西啊？\n小刚：都是从那边的商店买回来的。\n小丽：怎么还买红酒回来了？谁喝啊？\n小刚：这是给爷爷的礼物，明天我们一起送过去，看看爷爷奶奶。\n小丽：那我的礼物呢？快拿出来让我看看。\n小刚：我不是已经回来了吗？', translation:'Сяоли: Ты наконец вернулся! Откуда столько всего купил?\nСяоган: Всё из магазина вон там.\nСяоли: Зачем ещё красное вино? Кто будет пить?\nСяоган: Это подарок дедушке, завтра вместе отнесём, проведаем дедушку и бабушку.\nСяоли: А мой подарок? Доставай скорее, покажи.\nСяоган: Разве я уже не вернулся?' },
    { id:14, lesson:14, title:'你把水果拿过来', titleRu:'Принеси фрукты', content:'周太太：客人就要来了，你怎么还不打扫房间啊？\n周明：别着急，我让孩子们打扫呢，客人来的时候，他们会把房间打扫干净。\n周太太：那你也不能看电视啊。\n周明：你让我做什么？\n周太太：先把茶和杯子放好，然后把冰箱里的西瓜拿出来。\n周明：太热了，我还是先把空调打开吧。', translation:'Госпожа Чжоу: Гости скоро придут, почему ты ещё не убрал комнату?\nЧжоу Мин: Не волнуйся, я заставил детей убрать, когда гости придут, они уже уберут комнату.\nГоспожа Чжоу: Но ты не можешь смотреть телевизор.\nЧжоу Мин: Что мне делать?\nГоспожа Чжоу: Сначала поставь чай и чашки, потом достань арбуз из холодильника.\nЧжоу Мин: Слишком жарко, я лучше сначала включу кондиционер.' },
    { id:15, lesson:15, title:'其他都没什么问题', titleRu:'В остальном нет проблем', content:'大山：老师，我来中国留学两年了，但是我的汉语水平提高得一点儿也不快啊。\n老师：你每天认真学习，做练习、完成作业，一直不错啊。\n大山：这是我昨天的作业，您帮我看看对不对。\n老师：写得不错，除了这个句子意思有些不清楚外，其他都没什么问题。\n大山：谢谢老师！\n老师：以后有什么不明白的地方，可以给我打电话或者发电子邮件。', translation:'Дашань: Учитель, я учусь в Китае уже два года, но мой китайский улучшается совсем не быстро.\nУчитель: Ты каждый день усердно учишься, делаешь упражнения, выполняешь домашние задания — всё хорошо.\nДашань: Это моё вчерашнее домашнее задание, посмотрите, правильно?\nУчитель: Написано неплохо, кроме того, что смысл этого предложения немного неясен, в остальном нет проблем.\nДашань: Спасибо, учитель!\nУчитель: Если в будущем что-то будет непонятно, можешь позвонить мне или отправить электронное письмо.' },
    { id:16, lesson:16, title:'我现在累得下了班就想睡觉', titleRu:'Я так устал, что после работы хочу только спать', content:'小丽：我不喜欢一直住在同一个城市，想去其他城市看一看。\n周明：我年轻的时候也这么想，但是那时候没有钱，如果有钱，就去了。\n小丽：那您现在为什么不去？\n周明：现在钱不是问题了，主要是没有时间。\n小丽：我认为现在您有时间也不会出去玩儿。\n周明：你说得对，我现在累得下了班就想睡觉。', translation:'Сяоли: Я не люблю всё время жить в одном городе, хочу посмотреть другие города.\nЧжоу Мин: Я в молодости тоже так думал, но тогда не было денег, если бы были, поехал бы.\nСяоли: А почему сейчас не едете?\nЧжоу Мин: Сейчас деньги не проблема, главное — нет времени.\nСяоли: Я думаю, даже если бы у вас было время, вы бы не поехали.\nЧжоу Мин: Ты права, я сейчас так устаю, что после работы хочу только спать.' },
    { id:17, lesson:17, title:'谁都有办法看好你的“病”', titleRu:'У каждого есть способ вылечить твою «болезнь»', content:'周太太：最近我觉得哪儿都不舒服，你带我去医院检查检查吧。\n周明：不用去医院，谁都有办法看好你的“病”。我问你，你多久没运动了？\n周太太：我三年没运动了。\n周明：谁都知道运动对身体好。但是你吃饱了就睡。\n周太太：为了健康，我真应该多锻炼锻炼了。从明天起，我决定每天去长跑。', translation:'Госпожа Чжоу: В последнее время мне кажется, что везде нехорошо, отведи меня в больницу провериться.\nЧжоу Мин: Не надо в больницу, у каждого есть способ вылечить твою «болезнь». Скажи, сколько ты уже не занималась спортом?\nГоспожа Чжоу: Три года не занималась.\nЧжоу Мин: Все знают, что спорт полезен для здоровья. Но ты наелась и спишь.\nГоспожа Чжоу: Ради здоровья мне действительно нужно больше тренироваться. С завтрашнего дня я решила каждый день бегать.' },
    { id:18, lesson:18, title:'我相信他们会同意的', titleRu:'Я верю, они согласятся', content:'朋友：老周，我打算买房子了，想向你借点儿钱。\n周明：没问题，只要我有，就一定会借给你的。还差多少？\n朋友：还差5万块钱。\n周明：好，钱下午打给你。你打算在哪儿买房？\n朋友：就在我们医院前面。\n周明：那你以后去医院就方便了。', translation:'Друг: Лао Чжоу, я собираюсь купить квартиру, хочу занять у тебя немного денег.\nЧжоу Мин: Без проблем, если у меня есть, обязательно дам в долг. Сколько не хватает?\nДруг: Не хватает 50 тысяч.\nЧжоу Мин: Хорошо, днём переведу. Где собираешься покупать?\nДруг: Прямо перед нашей больницей.\nЧжоу Мин: Тогда тебе будет удобно ходить в больницу.' },
    { id:19, lesson:19, title:'你没看出来吗', titleRu:'Ты не узнал?', content:'爸爸：女儿最近喜欢把头发放在耳朵后面，你知道为什么吗？\n妈妈：这样可以使她的脸看上去漂亮一些。\n爸爸：我最近觉得她和以前不太一样了。\n妈妈：女儿变化不小，她小时候喜欢短头发，像男孩子一样。\n爸爸：我也想起来了。她现在慢慢地开始像个女孩子了。', translation:'Папа: Дочь в последнее время любит убирать волосы за уши, знаешь почему?\nМама: Так её лицо выглядит красивее.\nПапа: Мне кажется, она стала не такой, как раньше.\nМама: Дочь сильно изменилась, в детстве она любила короткие волосы, была похожа на мальчика.\nПапа: Я тоже вспомнил. Сейчас она постепенно становится похожей на девочку.' },
    { id:20, lesson:20, title:'我被他影响了', titleRu:'Я поддался его влиянию', content:'小丽：我的照相机被谁拿走了？怎么找不到了？\n同事：你再找找。是不是没带来？\n小丽：我找了，没找到啊。\n同事：别难过，再买一个吧，公司东门外不就有一个大商场吗？\n小丽：但是我这个月信用卡里的钱已经花得差不多了。', translation:'Сяоли: Кто взял мой фотоаппарат? Почему не могу найти?\nКоллега: Поищи ещё. Может, не приносила?\nСяоли: Я искала, не нашла.\nКоллега: Не расстраивайся, купи новый, разве за восточными воротами компании нет большого магазина?\nСяоли: Но в этом месяце деньги на кредитной карте я уже почти все потратила.' },
];

const GRAMMAR_TICKETS = [
    { id:1, lesson:1, question:'Что означает результативный комплемент 好?', shortAnswer:'Завершение действия с удовлетворительным результатом', fullAnswer:'Результативный комплемент 好 используется после глагола, например 吃好, 准备好, и указывает на завершение действия с удовлетворительным результатом. 我吃完了 означает только завершение действия, а 我吃好了 означает, что действие завершено и результат удовлетворителен.', tags:['基础'] },
    { id:2, lesson:1, question:'Как образуется отрицание 一……也/都+不/没……?', shortAnswer:'一 + счётное слово + сущ. + 也/都 + 不/没 + V', fullAnswer:'Конструкция используется для полного отрицания. Например: 我一个苹果也不想吃。昨天他一件衣服都没买。手机、电脑、地图，一个也不能少。', tags:['基础'] },
    { id:3, lesson:1, question:'Как используется союз 那?', shortAnswer:'В начале предложения указывает на результат или суждение на основе предыдущего', fullAnswer:'那 ставится в начале предложения и указывает на результат, вытекающий из предыдущего высказывания. Например: A: 我不想去看电影。B: 那我也不去了。', tags:['基础'] },
    { id:4, lesson:2, question:'Что такое простой направительный комплемент?', shortAnswer:'V + 来/去', fullAnswer:'来 указывает на движение к говорящему, 去 — от говорящего. Например: 你上来吧。你出去看看吧。', tags:['基础'] },
    { id:5, lesson:2, question:'Как выразить последовательность двух действий?', shortAnswer:'V1了……就V2……', fullAnswer:'Конструкция указывает на то, что второе действие происходит сразу после первого. Например: 我下了课就吃饭。妈妈起了床就做早饭。', tags:['基础'] },
    { id:6, lesson:2, question:'Что такое риторический вопрос 能……吗?', shortAnswer:'Утвердительная форма выражает отрицание, отрицательная — утверждение', fullAnswer:'Например: 你不做作业，也不练习，能学好吗？(不能学好) 你每天晚上吃了饭就睡觉，能不胖吗？(会胖)', tags:['基础'] },
    { id:7, lesson:3, question:'В чём разница между 还是 и 或者?', shortAnswer:'还是 — в вопросительных предложениях, 或者 — в утвердительных', fullAnswer:'还是 используется в вопросах: 你要喝咖啡还是喝茶？ 或者 используется в утверждениях: 今天晚上吃米饭或者面条都可以。', tags:['基础'] },
    { id:8, lesson:3, question:'Как выразить наличие предмета в определённом месте?', shortAnswer:'Location + V着 + Numeral + MW + N', fullAnswer:'Конструкция указывает на наличие предмета в месте. Например: 桌子上放着一杯咖啡。我家楼上住着一个老师。', tags:['基础'] },
    { id:9, lesson:3, question:'Как используется 会 для выражения возможности?', shortAnswer:'会 + V', fullAnswer:'会 указывает на возможность события в будущем. Например: 你穿得那么少，会感冒的。别担心，我会照顾好自己。', tags:['基础'] },
    { id:10, lesson:4, question:'Как образуется конструкция 又……又……?', shortAnswer:'又 + Adj1 + 又 + Adj2', fullAnswer:'Конструкция описывает одновременное наличие двух качеств. Например: 这个西瓜又大又甜。服务员又年轻又漂亮。', tags:['基础'] },
    { id:11, lesson:4, question:'Как выразить сопровождающее действие?', shortAnswer:'V1着(O1) + V2(O2)', fullAnswer:'V1着 указывает на способ или состояние, в котором происходит V2. Например: 弟弟吃着苹果写作业。她总是笑着跟客人说话。', tags:['基础'] },
    { id:12, lesson:5, question:'Что означает 了 в конце предложения?', shortAnswer:'Изменение ситуации', fullAnswer:'了 в конце предложения указывает на изменение ситуации или появление нового состояния. Например: 上个月很冷，现在天气不那么冷了。我现在喜欢夏天了。', tags:['基础'] },
    { id:13, lesson:5, question:'Как образуется конструкция 越来越 + Adj/V?', shortAnswer:'越来越 + Adj/V', fullAnswer:'Конструкция указывает на постепенное нарастание признака или действия. Например: 我认识的汉字越来越多。我越来越喜欢运动。', tags:['基础'] },
    { id:14, lesson:6, question:'Что такое комплемент возможности?', shortAnswer:'V得/不 + комплемент', fullAnswer:'Комплемент возможности указывает на возможность или невозможность достижения результата. Например: 我看得清楚那个汉字。楼太高了，我上不去。', tags:['基础'] },
    { id:15, lesson:6, question:'Как используется 呢 для вопроса о месте?', shortAnswer:'N + 呢？', fullAnswer:'Конструкция спрашивает, где находится человек или предмет. Например: 你的书呢？我的眼镜呢？', tags:['基础'] },
    { id:16, lesson:6, question:'В чём разница между 刚 и 刚才?', shortAnswer:'刚 — наречие, 刚才 — существительное', fullAnswer:'刚才 обычно указывает на несколько минут назад, 刚 — на короткий промежуток с точки зрения говорящего. 刚 ставится только перед глаголом, 刚才 — перед глаголом или в начале предложения.', tags:['基础'] },
    { id:17, lesson:7, question:'Как выразить длительность действия?', shortAnswer:'S + V + Duration + O', fullAnswer:'Конструкция указывает на продолжительность действия. Например: 她工作了三年。我们坐了一个小时公共汽车。', tags:['基础'] },
    { id:18, lesson:7, question:'Как выразить интерес?', shortAnswer:'对……感兴趣 / 对……有兴趣', fullAnswer:'Например: 他们对电影感兴趣。我儿子对打篮球不感兴趣。我对她更感兴趣。', tags:['基础'] },

const LS_KEY = 'hsk3_trainer_state';

/* =========================================================================
   STORAGE
   ========================================================================= */
function loadState() {
    try {
        const saved = localStorage.getItem(LS_KEY);
        if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.stats) State.stats = { ...State.stats, ...parsed.stats };
            if (parsed.settings) State.settings = { ...State.settings, ...parsed.settings };
        }
    } catch (e) { console.warn('Failed to load state', e); }
}
function saveState() {
    try {
        localStorage.setItem(LS_KEY, JSON.stringify({
            stats: State.stats,
            settings: State.settings,
        }));
    } catch (e) { console.warn('Failed to save state', e); }
}

/* =========================================================================
   UTILITY FUNCTIONS
   ========================================================================= */
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}
function getLessons() {
    const lessons = new Set(VOCAB.map(v => v.lesson));
    return [...lessons].sort((a, b) => a - b);
}
function getTopics() {
    const topics = new Set(VOCAB.map(v => v.topic));
    return [...topics].sort();
}
function getWordsByLesson(lesson) {
    return VOCAB.filter(v => v.lesson === lesson);
}
function getWordsByTopic(topic) {
    return VOCAB.filter(v => v.topic === topic);
}
function findWordByChinese(chinese) {
    return VOCAB.find(v => v.chinese === chinese) || null;
}
function showToast(msg, duration = 2000) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
}
function formatDate(date) {
    return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
}

/* =========================================================================
   THEME & SIZE
   ========================================================================= */
function applyTheme() {
    const s = State.settings;
    let theme = s.theme;
    if (theme === 'auto') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
}
function toggleTheme() {
    const order = ['light', 'dark', 'auto'];
    const idx = order.indexOf(State.settings.theme);
    State.settings.theme = order[(idx + 1) % order.length];
    applyTheme();
    saveState();
    showToast('Тема: ' + State.settings.theme);
}
function applySize() {
    document.documentElement.setAttribute('data-size', State.settings.size === 'normal' ? '' : State.settings.size);
}
function toggleSize() {
    const order = ['normal', 'large', 'compact'];
    const idx = order.indexOf(State.settings.size);
    State.settings.size = order[(idx + 1) % order.length];
    applySize();
    saveState();
    showToast('Размер: ' + State.settings.size);
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (State.settings.theme === 'auto') applyTheme();
});

/* =========================================================================
   MODAL
   ========================================================================= */
function openModal(contentHtml) {
    const overlay = document.getElementById('modalOverlay');
    const content = document.getElementById('modalContent');
    content.innerHTML = contentHtml;
    overlay.classList.add('active');
    State.modalOpen = true;
}
function closeModal() {
    const overlay = document.getElementById('modalOverlay');
    overlay.classList.remove('active');
    State.modalOpen = false;
}

/* =========================================================================
   RENDER ROUTER
   ========================================================================= */
function render() {
    const app = document.getElementById('app');
    let html = '';
    switch (State.view) {
        case 'home': html = renderHome(); break;
        case 'flashcards': html = renderFlashcards(); break;
        case 'vocab': html = renderVocab(); break;
        case 'grammar': html = renderGrammar(); break;
        case 'texts': html = renderTexts(); break;
        case 'translation': html = renderTranslationMenu(); break;
        case 'translation-tickets': html = renderTranslationTickets(); break;
        case 'grammar-tickets': html = renderGrammarTickets(); break;
        case 'exercise': html = renderExercise(); break;
        case 'search': html = renderSearch(); break;
        case 'stats': html = renderStats(); break;
        case 'settings': html = renderSettings(); break;
        case 'review-errors': html = renderReviewErrors(); break;
        case 'exam': html = renderExamMenu(); break;
        default: html = renderHome();
    }
    app.innerHTML = html;
    attachEventListeners();
}
function goHome() {
    State.view = 'home';
    State.exercise = { type: null, questions: [], currentIndex: 0, score: 0, answered: false, selectedOption: null, typedAnswer: '', showFeedback: false, feedbackText: '', feedbackCorrect: false };
    render();
}

function renderFlashcards() {
    if (State.cards.length === 0) {
        State.cards = shuffle(VOCAB);
        State.currentCardIndex = 0;
        State.isFlipped = false;
    }
    const card = State.cards[State.currentCardIndex];
    if (!card) return '<p>Нет карточек</p>';
    const showPinyin = State.settings.showPinyin;
    const showTranslation = State.settings.showTranslation;
    const total = State.cards.length;
    const idx = State.currentCardIndex + 1;
    const known = State.stats.studiedWords[card.id] || 0;
    return `
    <div class="panel">
        <div class="panel-header">
            <h2>Карточки</h2>
            <div class="flex gap-1 flex-wrap">
                <button class="small" onclick="filterCardsByLesson()">Урок</button>
                <button class="small" onclick="filterCardsByTopic()">Тема</button>
                <button class="small" onclick="shuffleCards()">🔀 Перемешать</button>

                        <div class="pinyin">${card.pinyin}</div>
                        ${showTranslation ? `<div class="translation">${card.translation}</div>` : '<div class="translation" style="color:var(--text-muted);">Перевод скрыт</div>'}
                        <div style="margin-top:0.5rem; font-size:0.8rem; color:var(--text-muted);">Урок ${card.lesson} · ${card.topic}</div>
                    </div>
                </div>
            </div>
            <div class="flex gap-2 items-center">
                <button onclick="prevCard()">◀</button>
                <span class="text-muted">${idx} / ${total}</span>
                <button onclick="nextCard()">▶</button>
            </div>
            <div class="flex gap-1 flex-wrap">
                <button class="small" onclick="markCardKnown()">✅ Знаю</button>
                <button class="small" onclick="markCardUnknown()">❌ Не знаю</button>
                <button class="small" onclick="togglePinyin()">${showPinyin ? 'Скрыть пиньинь' : 'Показать пиньинь'}</button>
                <button class="small" onclick="toggleTranslation()">${showTranslation ? 'Скрыть перевод' : 'Показать перевод'}</button>
            </div>
            ${known > 0 ? `<div class="text-muted" style="font-size:0.8rem;">Повторений: ${known}</div>` : ''}
        </div>
    </div>`;
}
function flipCard() {
    State.isFlipped = !State.isFlipped;
    render();
}
function nextCard() {
    if (State.currentCardIndex < State.cards.length - 1) {
        State.currentCardIndex++;
        State.isFlipped = false;
        render();
    }
}
function prevCard() {
    if (State.currentCardIndex > 0) {
        State.currentCardIndex--;
        State.isFlipped = false;
        render();
    }
}
function shuffleCards() {
    State.cards = shuffle(State.cards);
    State.currentCardIndex = 0;
    State.isFlipped = false;
    render();
}
function resetCards() {
    State.cards = shuffle(VOCAB);
    State.currentCardIndex = 0;
    State.isFlipped = false;
    render();
}
function togglePinyin() {
    State.settings.showPinyin = !State.settings.showPinyin;
    saveState();
    render();
}
function toggleTranslation() {
    State.settings.showTranslation = !State.settings.showTranslation;
    saveState();
    render();
}
function markCardKnown() {
    const card = State.cards[State.currentCardIndex];
    if (card) {
        State.stats.studiedWords[card.id] = (State.stats.studiedWords[card.id] || 0) + 1;
        saveState();
        showToast('Отмечено как изученное');
        nextCard();
    }
}
function markCardUnknown() {
    const card = State.cards[State.currentCardIndex];
    if (card) {
        State.stats.errors++;
        saveState();
        showToast('Добавлено в сложные');
        nextCard();
    }
}

function renderExercise() {
    if (State.exercise.questions.length === 0) {
        return renderExerciseMenu();
    }
    const ex = State.exercise;
    const q = ex.questions[ex.currentIndex];
    if (!q) return '<p>Ошибка: нет вопроса</p>';
    let html = `<div class="panel">
        <div class="panel-header">
            <h2>Упражнение</h2>
            <div class="flex gap-1">
                <span class="text-muted">${ex.currentIndex + 1} / ${ex.questions.length}</span>
                <button class="small" onclick="finishExercise()">Завершить</button>
            </div>
        </div>`;
    html += `<div class="exercise-container">
        <div class="question-text">${q.question}</div>`;
    if (q.type === 'choice') {
        html += '<div class="options">';
        q.options.forEach((opt, i) => {
            let cls = 'option-btn';
            if (ex.answered) {
                if (i === q.correct) cls += ' correct';
                else if (i === ex.selectedOption) cls += ' incorrect';
            }
            html += `<button class="${cls}" onclick="selectOption(${i})" ${ex.answered ? 'disabled' : ''}>${opt}</button>`;
        });
        html += '</div>';
    } else if (q.type === 'input') {
        html += `<input type="text" id="answerInput" placeholder="Введите ответ..." value="${ex.typedAnswer}" ${ex.answered ? 'disabled' : ''} oninput="State.exercise.typedAnswer = this.value">`;
        if (!ex.answered) {
            html += `<button class="primary mt-1" onclick="submitInput()">Проверить</button>`;
        }
    }
    if (ex.showFeedback) {
        html += `<div class="feedback ${ex.feedbackCorrect ? 'correct' : 'incorrect'}">${ex.feedbackText}</div>`;
        if (ex.answered && ex.currentIndex < ex.questions.length - 1) {
            html += `<button class="primary" onclick="nextQuestion()">Далее ▶</button>`;
        } else if (ex.answered && ex.currentIndex >= ex.questions.length - 1) {
            html += `<button class="primary" onclick="finishExercise()">Завершить</button>`;
        }
    }
    html += '</div></div>';
    return html;
}
function renderExerciseMenu() {
    let html = `<div class="panel">
        <div class="panel-header"><h2>Упражнения</h2><button class="small" onclick="setView('home')">🏠</button></div>
        <p class="text-muted mb-1">Выберите тип упражнения:</p>
        <div class="flex gap-1 flex-wrap">
            <button onclick="startExercise('translate-choice')">Выбор перевода</button>
            <button onclick="startExercise('word-choice')">Выбор слова</button>
            <button onclick="startExercise('fill-blank')">Заполнение пропусков</button>
            <button onclick="startExercise('typing')">Ввод слова</button>
            <button onclick="startExercise('match')">Сопоставление</button>
            <button onclick="startExercise('dictation')">Диктант</button>
            <button onclick="startExercise('true-false')">Правда/Ложь</button>
            <button onclick="startExercise('grammar-choice')">Грамматика (выбор)</button>
            <button onclick="startExercise('grammar-fill')">Грамматика (вставка)</button>
            <button onclick="startExercise('reorder')">Составление предложений</button>
            <button onclick="startExercise('mini-test')">Мини-тест</button>
        </div>
    </div>`;

function startExercise(type) {
    const ex = State.exercise;
    ex.type = type;
    ex.currentIndex = 0;
    ex.score = 0;
    ex.answered = false;
    ex.selectedOption = null;
    ex.typedAnswer = '';
    ex.showFeedback = false;
    ex.feedbackText = '';
    ex.feedbackCorrect = false;

    let questions = [];
    const allWords = [...VOCAB];
    const shuffled = shuffle(allWords);

    switch (type) {
        case 'translate-choice': {
            const sample = shuffled.slice(0, 15);
            questions = sample.map(w => {
                const wrong = shuffle(VOCAB.filter(x => x.id !== w.id)).slice(0, 3).map(x => x.translation);
                const options = shuffle([w.translation, ...wrong]);
                return { type: 'choice', question: `Как переводится «${w.chinese}» (${w.pinyin})?`, options, correct: options.indexOf(w.translation), word: w };
            });
            break;
        }
        case 'word-choice': {
            const sample = shuffled.slice(0, 15);
            questions = sample.map(w => {
                const wrong = shuffle(VOCAB.filter(x => x.id !== w.id)).slice(0, 3).map(x => x.chinese);
                const options = shuffle([w.chinese, ...wrong]);
                return { type: 'choice', question: `Выберите слово для перевода «${w.translation}»`, options, correct: options.indexOf(w.chinese), word: w };
            });
            break;
        }
        case 'fill-blank': {
            const sample = shuffled.filter(w => w.chinese.length >= 2).slice(0, 12);
            questions = sample.map(w => {
                const blanked = w.chinese[0] + '＿'.repeat(w.chinese.length - 1);
                const wrong = shuffle(VOCAB.filter(x => x.id !== w.id && x.chinese.length === w.chinese.length)).slice(0, 3).map(x => x.chinese);
                if (wrong.length < 3) {
                    const extra = shuffle(VOCAB.filter(x => x.id !== w.id)).slice(0, 3 - wrong.length).map(x => x.chinese);
                    wrong.push(...extra);
                }
                const options = shuffle([w.chinese, ...wrong.slice(0, 3)]);
                return { type: 'choice', question: `Заполните пропуск: ${blanked} (${w.pinyin}) — ${w.translation}`, options, correct: options.indexOf(w.chinese), word: w };
            });
            break;
        }
        case 'typing': {
            const sample = shuffled.slice(0, 12);
            questions = sample.map(w => ({
                type: 'input',
                question: `Напишите по-китайски: «${w.translation}» (${w.pinyin})`,
                answer: w.chinese,
                word: w,
            }));
            break;
        }
        case 'match': {
            const sample = shuffled.slice(0, 10);
            questions = sample.map(w => {
                const wrong = shuffle(VOCAB.filter(x => x.id !== w.id)).slice(0, 3).map(x => x.translation);
                const options = shuffle([w.translation, ...wrong]);
                return { type: 'choice', question: `Найдите пару для «${w.chinese}»`, options, correct: options.indexOf(w.translation), word: w };
            });
            break;
        }
        case 'dictation': {
            const sample = shuffled.slice(0, 10);
            questions = sample.map(w => ({
                type: 'input',
                question: `«${w.pinyin}» — ${w.translation}. Напишите иероглифами:`,
                answer: w.chinese,
                word: w,
            }));
            break;
        }
        case 'true-false': {
            const sample = shuffled.slice(0, 12);
            questions = sample.map(w => {
                const isTrue = Math.random() > 0.5;
                let shownTranslation = w.translation;
                if (!isTrue) {
                    const other = shuffled.find(x => x.id !== w.id);
                    shownTranslation = other ? other.translation : w.translation;
                }
                return {
                    type: 'choice',
                    question: `«${w.chinese}» означает «${shownTranslation}». Это правда?`,
                    options: ['Правда', 'Ложь'],
                    correct: isTrue ? 0 : 1,
                    word: w,
                };
            });
            break;
        }
        case 'grammar-choice': {
            const sample = shuffle(GRAMMAR).slice(0, 10);
            questions = sample.map(g => {
                const wrong = shuffle(GRAMMAR.filter(x => x.id !== g.id)).slice(0, 3).map(x => x.title);
                const options = shuffle([g.title, ...wrong]);
                return { type: 'choice', question: `Какая конструкция используется для: «${g.explanation}»?`, options, correct: options.indexOf(g.title), grammar: g };
            });
            break;
        }
        case 'grammar-fill': {
            const sample = shuffle(GRAMMAR).slice(0, 8);
            questions = sample.map(g => {
                const ex = g.examples[0];
                const blanked = ex.replace(g.title.replace(/……/g, '').trim(), '＿＿＿');
                const wrong = shuffle(GRAMMAR.filter(x => x.id !== g.id)).slice(0, 3).map(x => x.title);
                const options = shuffle([g.title, ...wrong]);
                return { type: 'choice', question: `Заполните пропуск: ${blanked}`, options, correct: options.indexOf(g.title), grammar: g };
            });
            break;
        }
        case 'reorder': {
            const sample = shuffle(TEXTS).slice(0, 5);
            questions = sample.map(t => {
                const sentences = t.content.split('\n').filter(s => s.trim().length > 0);
                const sentence = sentences[Math.floor(Math.random() * sentences.length)];
                const chunks = [];
                for (let i = 0; i < sentence.length; i += 2) {
                    chunks.push(sentence.substring(i, i + 2));
                }
                const shuffledChunks = shuffle(chunks);
                return {
                    type: 'choice',
                    question: `Восстановите порядок: ${shuffledChunks.join(' / ')}`,
                    options: [sentence, ...shuffle(sentences.filter(s => s !== sentence)).slice(0, 3)],
                    correct: 0,
                    original: sentence,
                };
            });
            questions = questions.map(q => {
                const opts = shuffle(q.options);
                return { ...q, options: opts, correct: opts.indexOf(q.original) };
            });
            break;
        }
        case 'mini-test': {
            const sample = shuffle([
                ...shuffled.slice(0, 5).map(w => ({ type: 'choice', question: `Перевод «${w.chinese}»?`, options: shuffle([w.translation, ...shuffle(VOCAB.filter(x => x.id !== w.id)).slice(0, 3).map(x => x.translation)]), correct: 0, word: w })),
                ...shuffle(GRAMMAR).slice(0, 5).map(g => ({ type: 'choice', question: `Конструкция: ${g.explanation}?`, options: shuffle([g.title, ...shuffle(GRAMMAR.filter(x => x.id !== g.id)).slice(0, 3).map(x => x.title)]), correct: 0, grammar: g })),
            ]);
            questions = sample.map(q => {
                const opts = shuffle(q.options);
                return { ...q, options: opts, correct: opts.indexOf(q.options[0]) };
            });
            break;
        }
    }

    ex.questions = questions;
    State.view = 'exercise';
    render();
}
function selectOption(i) {
    const ex = State.exercise;
    if (ex.answered) return;
    const q = ex.questions[ex.currentIndex];
    ex.selectedOption = i;
    ex.answered = true;
    ex.showFeedback = true;
    const correct = q.correct;
    if (i === correct) {
        ex.score++;
        State.stats.correct++;
        ex.feedbackText = '✅ Правильно!';
        ex.feedbackCorrect = true;
    } else {
        State.stats.errors++;
        ex.feedbackText = `❌ Неправильно. Правильный ответ: ${q.options[correct]}`;
        ex.feedbackCorrect = false;
    }
    saveState();
    render();
}
function submitInput() {
    const ex = State.exercise;
    if (ex.answered) return;
    const q = ex.questions[ex.currentIndex];
    const answer = (ex.typedAnswer || '').trim().toLowerCase();
    const correctAnswer = q.answer.toLowerCase();
    ex.answered = true;
    ex.showFeedback = true;
    if (answer === correctAnswer) {
        ex.score++;
        State.stats.correct++;
        ex.feedbackText = '✅ Правильно!';
        ex.feedbackCorrect = true;
    } else {
        State.stats.errors++;
        ex.feedbackText = `❌ Неправильно. Правильный ответ: ${q.answer}`;
        ex.feedbackCorrect = false;
    }
    saveState();
    render();
}
function nextQuestion() {
    const ex = State.exercise;
    if (ex.currentIndex < ex.questions.length - 1) {
        ex.currentIndex++;
        ex.answered = false;
        ex.selectedOption = null;
        ex.typedAnswer = '';
        ex.showFeedback = false;
        ex.feedbackText = '';
        ex.feedbackCorrect = false;
        render();
    } else {
        finishExercise();
    }
}
function finishExercise() {
    const ex = State.exercise;
    const total = ex.questions.length;
    const score = ex.score;
    const pct = total > 0 ? Math.round((score / total) * 100) : 0;
    State.stats.completedExercises++;
    saveState();
    openModal(`<h3>Результат</h3>
        <p>Правильных ответов: ${score} из ${total} (${pct}%)</p>
        <div class="progress-bar mt-1"><div style="width:${pct}%"></div></div>
        <div class="mt-2 flex gap-1">
            <button onclick="closeModal(); startExercise('${ex.type}')">Повторить</button>
            <button onclick="closeModal(); setView('home')">В меню</button>
        </div>`);
    State.exercise = { type: null, questions: [], currentIndex: 0, score: 0, answered: false, selectedOption: null, typedAnswer: '', showFeedback: false, feedbackText: '', feedbackCorrect: false };
    render();
}

        <div class="mt-2"><button onclick="closeModal()">Закрыть</button></div>`;
    openModal(html);
}
function toggleGrammarAnswer() {
    const el = document.getElementById('grammarAnswer');
    if (el) el.classList.toggle('hidden');
}
function markGrammarStudied(id) {
    State.stats.grammarTicketProgress[id] = 1;
    saveState();
    showToast('Отмечено как изученное');
    closeModal();
    render();
}

/* =========================================================================
   REVIEW ERRORS
   ========================================================================= */
function renderReviewErrors() {
    const difficult = VOCAB.filter(w => (State.stats.studiedWords[w.id] || 0) === 0);
    const sample = shuffle(difficult).slice(0, 20);
    if (sample.length === 0) {
        return `<div class="panel"><div class="panel-header"><h2>Повторение ошибок</h2><button class="small" onclick="setView('home')">🏠</button></div>
            <p>Нет сложных слов для повторения. Отлично!</p></div>`;
    }
    State.cards = sample;
    State.currentCardIndex = 0;
    State.isFlipped = false;
    State.view = 'flashcards';
    render();
    return '';
}

/* =========================================================================
   SEARCH
   ========================================================================= */
function renderSearch() {
    return `<div class="panel">
        <div class="panel-header"><h2>Поиск</h2><button class="small" onclick="setView('home')">🏠</button></div>
        <input type="text" id="searchInput" placeholder="Введите слово, перевод, пиньинь, тему..." oninput="performSearch()">
        <div id="searchResults" class="mt-2"></div>
    </div>`;
}
function performSearch() {
    const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    const results = document.getElementById('searchResults');
    if (!query) { results.innerHTML = ''; return; }
    const wordResults = VOCAB.filter(w =>
        w.chinese.toLowerCase().includes(query) ||
        w.pinyin.toLowerCase().includes(query) ||
        w.translation.toLowerCase().includes(query) ||
        w.topic.toLowerCase().includes(query)
    ).slice(0, 20);
    const grammarResults = GRAMMAR.filter(g =>
        g.title.toLowerCase().includes(query) ||
        g.explanation.toLowerCase().includes(query)
    ).slice(0, 10);
    const ticketResults = TRANSLATION_TICKETS.filter(t =>
        t.question.toLowerCase().includes(query) ||
        t.keywords.some(k => k.toLowerCase().includes(query))
    ).slice(0, 10);
    const grammarTicketResults = GRAMMAR_TICKETS.filter(t =>
        t.question.toLowerCase().includes(query) ||
        t.fullAnswer.toLowerCase().includes(query)
    ).slice(0, 10);

    let html = '';
    if (wordResults.length > 0) {
        html += '<h4>Слова</h4>';
        wordResults.forEach(w => {
            html += `<div class="list-item">
                <div><span class="chinese">${w.chinese}</span> <span class="pinyin">${w.pinyin}</span></div>
                <div class="translation">${w.translation}</div>
            </div>`;
        });
    }
    if (grammarResults.length > 0) {
        html += '<h4 class="mt-1">Грамматика</h4>';
        grammarResults.forEach(g => {
            html += `<div class="list-item"><div><strong>${g.title}</strong> — ${g.explanation}</div></div>`;
        });
    }
    if (ticketResults.length > 0) {
        html += '<h4 class="mt-1">Билеты (перевод)</h4>';
        ticketResults.forEach(t => {
            html += `<div class="list-item"><div>${t.question}</div></div>`;
        });
    }
    if (grammarTicketResults.length > 0) {
        html += '<h4 class="mt-1">Билеты (грамматика)</h4>';
        grammarTicketResults.forEach(t => {
            html += `<div class="list-item"><div>${t.question}</div></div>`;
        });
    }
    if (!html) html = '<p class="text-muted">Ничего не найдено</p>';
    results.innerHTML = html;
}

/* =========================================================================
   STATS
   ========================================================================= */
function renderStats() {
    const totalWords = VOCAB.length;
    const studied = Object.keys(State.stats.studiedWords).length;
    const remaining = totalWords - studied;
    const totalExercises = State.stats.completedExercises;
    const errors = State.stats.errors;
    const correct = State.stats.correct;
    const totalAnswers = correct + errors;
    const pct = totalAnswers > 0 ? Math.round((correct / totalAnswers) * 100) : 0;
    const grammarLearned = Object.keys(State.stats.grammarTicketProgress).length;
    const ticketsDone = Object.keys(State.stats.ticketProgress).length;

    return `<div class="panel">
        <div class="panel-header"><h2>Статистика</h2><button class="small" onclick="setView('home')">🏠</button></div>
        <div class="stats-grid">
            <div class="stat-item"><div class="value">${totalWords}</div><div class="label">Всего слов</div></div>
            <div class="stat-item"><div class="value">${studied}</div><div class="label">Изучено</div></div>
            <div class="stat-item"><div class="value">${remaining}</div><div class="label">Осталось</div></div>
            <div class="stat-item"><div class="value">${totalExercises}</div><div class="label">Упражнений</div></div>
            <div class="stat-item"><div class="value">${errors}</div><div class="label">Ошибок</div></div>
            <div class="stat-item"><div class="value">${pct}%</div><div class="label">Успешность</div></div>
            <div class="stat-item"><div class="value">${grammarLearned}/${GRAMMAR_TICKETS.length}</div><div class="label">Грамматика</div></div>
            <div class="stat-item"><div class="value">${ticketsDone}/${TRANSLATION_TICKETS.length}</div><div class="label">Перевод</div></div>
        </div>
        <div class="mt-2">
            <p>Прогресс по словам:</p>
            <div class="progress-bar"><div style="width:${Math.round(studied/totalWords*100)}%"></div></div>
        </div>
    </div>`;
}

/* =========================================================================
   SETTINGS
   ========================================================================= */
function renderSettings() {
    const s = State.settings;
    return `<div class="panel">
        <div class="panel-header"><h2>Настройки</h2><button class="small" onclick="setView('home')">🏠</button></div>
        <div class="grid-2">
            <div>
                <h4>Тема</h4>
                <select onchange="State.settings.theme=this.value; applyTheme(); saveState();">
                    <option value="auto" ${s.theme==='auto'?'selected':''}>Авто</option>
                    <option value="light" ${s.theme==='light'?'selected':''}>Светлая</option>
                    <option value="dark" ${s.theme==='dark'?'selected':''}>Тёмная</option>
                </select>
            </div>
            <div>
                <h4>Размер</h4>
                <select onchange="State.settings.size=this.value; applySize(); saveState();">
                    <option value="normal" ${s.size==='normal'?'selected':''}>Обычный</option>
                    <option value="large" ${s.size==='large'?'selected':''}>Крупный</option>
                    <option value="compact" ${s.size==='compact'?'selected':''}>Компактный</option>
                </select>
            </div>
        </div>
        <div class="mt-2">
            <label><input type="checkbox" ${s.showPinyin?'checked':''} onchange="State.settings.showPinyin=this.checked; saveState();"> Показывать пиньинь</label><br>
            <label><input type="checkbox" ${s.showTranslation?'checked':''} onchange="State.settings.showTranslation=this.checked; saveState();"> Показывать перевод</label><br>
            <label><input type="checkbox" ${s.randomOrder?'checked':''} onchange="State.settings.randomOrder=this.checked; saveState();"> Случайный порядок</label>
        </div>
        <div class="mt-2 flex gap-1 flex-wrap">
            <button onclick="clearProgress()">🗑 Очистить прогресс</button>
            <button onclick="exportProgress()">📤 Экспорт</button>
            <button onclick="importProgress()">📥 Импорт</button>
        </div>
    </div>`;
}
function clearProgress() {
    if (confirm('Вы уверены, что хотите очистить весь прогресс?')) {
        State.stats = { studiedWords: {}, completedExercises: 0, errors: 0, correct: 0, grammarProgress: {}, ticketProgress: {}, grammarTicketProgress: {} };
        saveState();
        showToast('Прогресс очищен');
        render();
    }
}
function exportProgress() {
    const data = JSON.stringify({ stats: State.stats, settings: State.settings });
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'hsk3_progress.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Экспортировано');
}
function importProgress() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                if (data.stats) State.stats = { ...State.stats, ...data.stats };
                if (data.settings) State.settings = { ...State.settings, ...data.settings };
                saveState();
                applyTheme();
                applySize();
                showToast('Импортировано');
                render();
            } catch (err) {
                showToast('Ошибка импорта');
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

/* =========================================================================
   EXAM MENU
   ========================================================================= */
function renderExamMenu() {
    return `<div class="panel">
        <div class="panel-header"><h2>Экзамен</h2><button class="small" onclick="setView('home')">🏠</button></div>
        <p class="text-muted mb-1">Проверка знаний по всему материалу.</p>
        <div class="flex gap-1 flex-wrap">
            <button onclick="startExam()">🎯 Начать экзамен (20 вопросов)</button>
            <button onclick="startExercise('mini-test')">Мини-тест</button>
        </div>
    </div>`;
}
function startExam() {
    const vocabQ = shuffle(VOCAB).slice(0, 10).map(w => {
        const wrong = shuffle(VOCAB.filter(x => x.id !== w.id)).slice(0, 3).map(x => x.translation);
        const options = shuffle([w.translation, ...wrong]);
        return { type: 'choice', question: `Перевод «${w.chinese}»?`, options, correct: options.indexOf(w.translation) };
    });
    const grammarQ = shuffle(GRAMMAR).slice(0, 10).map(g => {
        const wrong = shuffle(GRAMMAR.filter(x => x.id !== g.id)).slice(0, 3).map(x => x.title);
        const options = shuffle([g.title, ...wrong]);
        return { type: 'choice', question: `Какая конструкция: ${g.explanation}?`, options, correct: options.indexOf(g.title) };
    });
    State.exercise = {
        type: 'exam',
        questions: shuffle([...vocabQ, ...grammarQ]),
        currentIndex: 0,
        score: 0,
        answered: false,
        selectedOption: null,
        typedAnswer: '',
        showFeedback: false,
        feedbackText: '',
        feedbackCorrect: false,
    };
    State.view = 'exercise';
    render();
}
